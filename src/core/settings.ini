[greeting]
case = lower
separator_policy = single-space
expected_length = 11

[pi]
digits = 1000
quorum = 2

[cpu]
firmware = init.asm
self_test = selftest.asm
pi_digits_address = 0x8000
watchdog_cycles = 5000000
; purely decorative: the emulator runs as fast as Python lets it
clock_hz = 4772727

[committee]
members = 5
required_majority = 0.6

[warmup]
collatz_limit = 3000
sieve_limit = 20000
matrix_size = 6
bogosort_size = 5
entropy_rounds = 64

[rendering]
trailing_newline = yes

[ledger]
; leading hex zeros required per block (proof of work)
difficulty = 2

[security]
product_id = hello-world
; max relative drift between wall clock and monotonic clock
clock_tolerance = 0.5
